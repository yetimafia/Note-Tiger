# Builds the Windows installer and publishes it as a GitHub release when a version tag (v1.2.3) is pushed.
# Note Tiger's "Update now" button downloads the installer from the latest release.
name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-go@v5
        with:
          go-version-file: window/go.mod
          cache: false
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y nsis gcc-mingw-w64-x86-64
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v=$(node -p "require('./package.json').version")
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} doesn't match package.json version $v"; exit 1; }
      - name: Build installer
        env:
          GOPROXY: https://proxy.golang.org,direct
        run: bash installer/build.sh
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Note Tiger ${{ github.ref_name }}
          body_path: installer/release-notes.md
          files: dist/NoteTiger-Setup-*.exe
      - name: Keep the installer (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: installer
          path: dist/NoteTiger-Setup-*.exe
